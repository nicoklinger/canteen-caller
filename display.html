<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Now Serving</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/display.css">
</head>
<body>
  <div class="glow glow-a" aria-hidden="true"></div>
  <div class="glow glow-b" aria-hidden="true"></div>

  <header class="welcome">
    <div class="welcome-text">
      <h1>Welcome to the <span class="hl">CUED Canteen</span>!</h1>
      <p>Wait here for your order to be called<span class="dots" aria-hidden="true"><i>.</i><i>.</i><i>.</i></span></p>
    </div>
    <time class="clock num" id="clock"></time>
  </header>

  <main class="board">
    <section class="now" id="now">
      <h2 class="label"><span class="live" aria-hidden="true"></span>Now serving</h2>
      <div class="current" id="current" data-len="0">–</div>
    </section>

    <section class="prev">
      <h2 class="label">Previously called</h2>
      <ol class="history" id="history"></ol>
    </section>
  </main>

  <div class="typing num" id="typing" hidden></div>
  <button class="sound-hint" id="sound-hint" hidden>Click anywhere to turn on sound</button>

  <div class="start" id="start">
    <div class="start-card">
      <p class="start-title">Customer display</p>
      <p>Click to start full screen with sound.</p>
      <p class="start-small">Move this window to the customer screen first.</p>
    </div>
  </div>

  <script type="module" src="js/display.js"></script>
</body>
</html>
